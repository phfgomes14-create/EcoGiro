spring.application.name=backend

# Habilita o console do H2 na web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração da URL do Banco de Dados com persistência ativa durante a execução
spring.datasource.url=jdbc:h2:mem:ecogirodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite visualizar o console dentro do navegador sem bloqueios de segurança
spring.h2.console.settings.web-allow-others=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true