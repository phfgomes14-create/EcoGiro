<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16863d">
    <title>Cadastro de usuário | EcoGiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/register.css">
    <script src="assets/js/login.js" defer></script>
</head>
<body>
    <main class="login-page">
        <a class="brand" href="index.html" aria-label="EcoGiro - voltar à página inicial">
            <img src="assets/img/icone.svg" alt="">
            <span>Eco<span class="brand-accent">Giro</span></span>
        </a>

        <section class="login-card register-card" aria-labelledby="register-title">
            <div class="role-switch" aria-label="Tipo de cadastro">
                <a class="role-option active" href="cadastro.html" aria-current="page">
                    <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                    <span>Usuário</span>
                </a>
                <a class="role-option" href="admin-cadastro.html">
                    <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                    <span>Administrador</span>
                </a>
            </div>

            <div class="register-heading">
                <span class="eyebrow"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> NOVO CADASTRO</span>
                <h1 id="register-title">Crie sua conta</h1>
                <p>Preencha seus dados para começar sua jornada com a EcoGiro.</p>
            </div>

            <form class="registration-form" action="/register" method="post">
                <div class="input-group">
                    <label for="full-name">Nome completo</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-id-card" aria-hidden="true"></i>
                        <input type="text" id="full-name" name="fullName" autocomplete="name" placeholder="Digite seu nome completo" required>
                    </div>
                </div>

                <div class="registration-grid">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <div class="input-with-icon">
                            <i class="fa-regular fa-address-card" aria-hidden="true"></i>
                            <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="Somente 11 números" title="Digite o CPF com 11 números" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="age">Idade</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-cake-candles" aria-hidden="true"></i>
                            <input type="number" id="age" name="age" min="1" max="120" placeholder="Ex.: 25" required>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="exemplo@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Crie uma senha</label>
                    <div class="password-field">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required>
                        <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Mostrar senha"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                    <p class="password-hint">A senha deve ter no mínimo 8 caracteres.</p>
                </div>

                <button class="submit-button" type="submit"><i class="fa-solid fa-user-check" aria-hidden="true"></i> Criar conta</button>
            </form>

            <p class="signup-note">Já possui uma conta? <a href="login.html">Entrar como usuário</a></p>
            <a class="back-home" href="index.html">← Voltar para o início</a>
        </section>

        <p class="page-footer">© 2026 EcoGiro. Mobilidade mais leve para a cidade.</p>
    </main>
</body>
</html>
