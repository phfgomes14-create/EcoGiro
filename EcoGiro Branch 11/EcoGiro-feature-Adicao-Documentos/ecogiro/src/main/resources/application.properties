spring.application.name=ecogiro
server.port=${PORT:8080}

# Local: H2 persistente. Produção (Neon/Render): definir SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ecogiro;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nunca reutilize o valor padrão em produção.
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:ECOGIRO-ADMIN-2026}
