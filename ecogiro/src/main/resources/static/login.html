<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16863d">
    <title>Entrar | EcoGiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">
    <script src="assets/js/login.js" defer></script>
</head>
<body>
    <main class="login-page">
        <a class="brand" href="index.htm" aria-label="EcoGiro — voltar à página inicial">
            <img src="assets/img/icone.svg" alt="">
            <span>Eco<span class="brand-accent">Giro</span></span>
        </a>

        <section class="login-card" aria-labelledby="login-title">
            <div class="login-heading">
                <span class="eyebrow">BEM-VINDO DE VOLTA</span>
                <h1 id="login-title">Acesse sua conta</h1>
                <p>Entre para continuar sua jornada com a EcoGiro.</p>
            </div>

            <form action="/login" method="post">
                <div class="input-group">
                    <label for="username">E-mail ou nome de usuário</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        inputmode="email"
                        placeholder="exemplo@email.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="/esqueci-senha" class="remember-password">Esqueceu a senha?</a>
                    </div>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                        >
                        <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
                    </div>
                </div>

                <button class="submit-button" type="submit">Entrar</button>
            </form>

            <p class="signup-note">Ainda não tem uma conta? <a href="index.htm#planos">Conheça nossos planos</a></p>
            <a class="back-home" href="index.htm">← Voltar para o início</a>
        </section>

        <p class="page-footer">© 2026 EcoGiro. Mobilidade mais leve para a cidade.</p>
    </main>
</body>
</html>
